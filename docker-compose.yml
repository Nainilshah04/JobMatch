version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: jobmatch-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobmatch
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - LLM_PROVIDER=openai
      - LLM_API_KEY=${LLM_API_KEY:-your_llm_api_key_here}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL Database with pgvector extension enabled
  db:
    image: pgvector/pgvector:pg16
    container_name: jobmatch-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
